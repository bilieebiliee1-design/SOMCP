# CNB 流水线：main 分支 push 后，把代码同步到 GitHub 镜像仓库。
# 同步方向以 CNB 为准，分叉时强制覆盖（force: true）。
# 同步所需凭据由流水线运行期注入，本文件不保存任何密钥。
main:
  push:
    - imports:
        - https://cnb.cool/SOMCP/key/-/blob/main/github.yml
      services:
        - docker
      stages:
        - name: 同步到 GitHub
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/bilieebiliee1-design/SOMCP.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            branch: main
            force: true

# CNB 流水线：main 分支 push 后，把代码同步到 GitHub 镜像仓库。
# 同步方向以 CNB 为准，分叉时强制覆盖（force: true）。
# 同步所需凭据与签名密钥由流水线运行期注入，本文件不保存任何密钥。
#
# 为什么不用普通 git-sync 插件直接推：
# 直接推会把 CNB 的提交对象原样搬过去。这些提交的提交者是 CNB 侧的合并身份
# （如 cnb <cnb@cnb.local>），签名用的是 CNB 的密钥；GitHub 既不认识这个邮箱
# 也不认识这把密钥，于是镜像仓库里所有提交都显示 Unverified。
# 现在改为在流水线里重写历史（同样的 tree / 作者 / 提交信息），把提交者换成
# GitHub 账号身份，用已注册到该账号的 GPG 密钥重新签名，再强推回 GitHub，
# 镜像仓库的提交即为 Verified。工具见 tools/sync-github-verified.py。
#
# 为什么这里要显式关掉子模块：
# CNB 的 git.submodules 默认是 true，工作区准备阶段就会 `git submodule update
# --init --recursive` 递归拉 third_party/*。而本流水线只做「重写历史 + 重签名 +
# 强推」，一个文件都不编译，子模块纯属拖累；更要命的是 rizinorg/ghidra 是会被
# 清洗重写的仓，某个 pin 一旦在上游消失，克隆阶段就直接
#   fatal: remote error: upload-pack: not our ref <sha>
#   Errors during submodule fetch: third_party/rz-ghidra
# 整条流水线在这里红掉，连下面这段 script 都进不去（见构建 cnb-0rs-1k6b0n0ih）。
# 需要子模块的 native 构建请在那条流水线里自己调 tools/init-submodules.sh
# （它把死 pin 变成一个打印「bump the gitlink or update the tag」的具名检查）。
main:
  push:
    - git:
        submodules: false
      imports:
        - https://cnb.cool/SOMCP/key/-/blob/main/github.yml
      stages:
        - name: 同步到 GitHub（重写历史并重签名）
          image: python:3.12-alpine
          script: |
            apk add --no-cache git gnupg bash
            echo "${GPG_PRIVATE_KEY_B64}" | base64 -d > /tmp/signing_key.asc
            gpg --batch --import /tmp/signing_key.asc
            git config --global user.signingkey "${GPG_SIGNING_KEY_ID}"
            git config --global gpg.format openpgp
            git config --global user.name "${GIT_COMMITTER_NAME}"
            git config --global user.email "${GIT_COMMITTER_EMAIL}"
            # --no-recurse-submodules 不是可选优化，是这条流水线能跑起来的前提。
            # 递归由工作树触发：日志里 `Fetching submodule third_party/rz-ghidra`
            # 说明 runner 上那份子模块工作树是存在且已初始化的（10 项 active=true
            # 只是从 .git/config 继承下来的配置，光有 active 不会让 fetch 递归）。
            # 于是镜像仓库该同步的东西一件没同步，却先在子模块上死掉：
            # `fatal: remote error: upload-pack: not our ref b37dbb93...`，与本次
            # 要推的历史毫无关系。同步任务只搬提交对象，不需要任何子模块，
            # tools/sync-github-verified.py 全文也只有 commit-tree / mktag / push，
            # 没有 fetch、checkout 或 submodule，关掉递归不会伤到后面任何一步。
            #
            # 关于那个 SHA，只写有读数的部分：`Fetching submodule
            # third_party/rz-ghidra` 配 `From https://github.com/rizinorg/rz-ghidra`
            # 说明请求发往 rz-ghidra 自己的远端；若索取的是嵌套 pin，按 rz-ghidra
            # 的 .gitmodules 应为 .../rizinorg/ghidra，日志里没有这一条。
            # b37dbb93 在 rizinorg/ghidra 与 rizinorg/rz-ghidra 两仓都不存在
            # （GitHub API 两边都回 422 `No commit found for SHA`），rz-ghidra
            # 全部 421 个提交的 ghidra/ghidra gitlink 里也没有它。
            # 是顶层 gitlink 还是嵌套 pin 过期，没有读数能区分，所以归因到此为止。
            git -c fetch.recurseSubmodules=no fetch --tags --force --no-recurse-submodules origin
            python3 tools/sync-github-verified.py --source-ref HEAD --target-url https://github.com/bilieebiliee1-design/SOMCP.git

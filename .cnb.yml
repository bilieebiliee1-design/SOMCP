# CNB 流水线：main 分支 push 后，把代码同步到 GitHub 镜像仓库。
# 同步方向以 CNB 为准，分叉时强制覆盖（force: true）。
#
# 需要先在 CNB 仓库「设置 → 环境变量」里配置（建议勾选"密钥"）：
#   GIT_USERNAME      GitHub 用户名；用 PAT 认证时也可填 x-access-token
#   GIT_ACCESS_TOKEN  对目标仓库有写权限的 GitHub PAT
main:
  push:
    - services:
        - docker
      stages:
        - name: 同步到 GitHub
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/bilieebiliee1-design/SOMCP.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            branch: main
            force: true

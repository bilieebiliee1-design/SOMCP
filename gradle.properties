org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
# Maven Central（repo1.maven.org）对同一出口 IP 有共享的请求速率上限。CI 冷启动要拉几十个
# 插件/依赖的 POM 与 JAR，撞上 HTTP 429 很常见。Gradle 对 429 **是**会重试的
# （NetworkingIssueVerifier 把 429 归入 transient），但默认只试 3 次、退避 1 秒，
# 冷启动那一波并发下不够；重试用尽后报出来的却是
#   Plugin [id: 'org.jetbrains.kotlin.android', version: '2.4.0'] was not found
# —— 版本明明存在（同一个 POM 单独请求就是 200），只是那次请求被限流。
#
# 键名是 max.tentatives（Gradle 8 没有 max.retries，写了不报错、静默无效），
# 而且**必须带 systemProp. 前缀**：ErrorHandlingModuleComponentRepository 里是
# `Integer.getInteger(KEY)` 读 **JVM 属性**，Gradle 只把 systemProp.* 转发进 JVM。
# 不带前缀的那几行看上去更像「Gradle 属性」，实际 Gradle 根本不读。
# A/B 实测（空 GRADLE_USER_HOME、最小工程）：不带前缀 → BUILD FAILED；
# 带前缀且 12 次 → BUILD SUCCESSFUL。镜像预热仍是主力，这里是兜底。
#
# 注意：init script 里改 System 属性太晚（仓库传输组件已初始化），只能靠 properties / -D。
systemProp.org.gradle.internal.repository.max.tentatives=12
systemProp.org.gradle.internal.repository.initial.backoff=1000
# 连接/DNS 这类 I/O 层的重试，与 429 的仓库级重试是两件事，各归各管。
systemProp.org.gradle.network.retries=5

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
# Maven Central（repo1.maven.org）对同一出口 IP 有共享的请求速率上限，CI 上冷启动要拉几十个
# 插件/依赖的 POM 与 JAR，很容易撞上 HTTP 429。Gradle 默认对 429 直接判死，表现为
#   Plugin [id: 'org.jetbrains.kotlin.android', version: '2.4.0'] was not found
# —— 版本明明存在（POM 单独请求就是 200），只是那一次请求被限流。
# 这两行让 Gradle 把 429/5xx 当作可重试错误（注意不是 systemProp：这组是 Gradle 自己的
# 仓库级设置，加 systemProp 前缀会被当成 JVM 属性，Gradle 读不到）。
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=1000
# 限流环境下大工程不必一路并发拉包：并发越高越容易被连续限流。
org.gradle.parallel=false

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
# Maven Central（repo1.maven.org）对同一出口 IP 有共享的请求速率上限，CI 上冷启动要拉几十个
# 插件/依赖的 POM 与 JAR，很容易撞上 HTTP 429。Gradle 默认对 429 直接判死，表现为
#   Plugin [id: 'org.jetbrains.kotlin.android', version: '2.4.0'] was not found
# —— 版本明明存在（POM 单独请求就是 200），只是那一次请求被限流。
#
# 真正生效的开关是 org.gradle.internal.repository.max.tentatives（重试次数）与
# initial.backoff —— 是 **Gradle 属性**，不是 systemProperty：带上 systemProp.
# 前缀只会变成 JVM 属性，Gradle 根本不读（曾经那么写过，等于没设）。
# org.gradle.network.retries 管的是另一件事：连接/DNS 这类 I/O 层的重试。
# 两者都留着，限流与网络抖动各归各管。
org.gradle.internal.repository.max.tentatives=3
org.gradle.internal.repository.initial.backoff=1000
org.gradle.network.retries=5

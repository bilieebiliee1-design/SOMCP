org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
# Maven Central（repo1.maven.org）对同一出口 IP 有共享的请求速率上限。CI 冷启动要拉几十个
# 插件/依赖的 POM 与 JAR，撞上 HTTP 429 很常见。Gradle 对 429 **是**会重试的
# （NetworkingIssueVerifier 把它归入 transient），但默认只试 3 次、退避 1 秒，
# 冷启动那一波并发下不够；重试用尽后报出来的却是
#   Plugin [id: 'org.jetbrains.kotlin.android', version: '2.4.0'] was not found
# —— 版本明明存在（同一个 POM 单独请求就是 200），只是那次请求被限流。
#
# 键名是 max.tentatives（不是 max.retries：Gradle 8 没有那个键，写了不报错、静默无效），
# 且必须带 systemProp. 前缀 —— 源码里是 Integer.getInteger(key) 读 JVM 属性，
# Gradle 只把 systemProp.* 转发进 JVM，不带前缀等于没配。
# 这两行不是 CI 专属，本地同样生效。镜像预热是主力，这里只是兜底。
#
# 注意：init script 里改 System 属性太晚（仓库传输组件已初始化），只能靠 properties / -D。
systemProp.org.gradle.internal.repository.max.tentatives=12
systemProp.org.gradle.internal.repository.initial.backoff=1000

 *
 * 把 app/libs 下打补丁的 jar 当成「上游同名模块的替代品」挂进依赖图。
 *
 * 为什么需要这一步：`implementation(files("libs/unidbg-api-...-patched.jar"))` 这类
 * 依赖在 Gradle 眼里是「无坐标的文件」，而 upstream 那份会经 unidbg-api 的 POM
 * 传递依赖自动进来。早年两边并存也能编译，是因为上游 POM 拿不到、Gradle 把它当成
 * 无元数据模块（不参与冲突检测）；CNB 的镜像预热把 POM 缓存下来之后，真实依赖图
 * 第一次完整出现，于是：
 *
 *   Duplicate class com.github.unidbg.AbstractEmulator found in modules
 *     unidbg-api-0.9.9-android-patched.jar and com.github.zhkl0228.unidbg:unidbg-api:0.9.9
 *   2 files found with path 'android/sdk23/system/usr/share/zoneinfo/tzdata'
 *     - unidbg-android-0.9.9-android-patched.jar
 *     - com.github.zhkl0228.unidbg:unidbg-android:0.9.9
 *
 * 做法：在解析**之前**把上游那份从 selector 列表里摘掉 ——
 * `incoming.artifactView { beforeResolve { ... } }`，`beforeResolve` 回调拿到的是
 * `ComponentSelector` 集合，`removeAll` 之后 Gradle 根本不会解析上游那个模块，
 * 冲突也就无从发生。判据是「这个配置里有没有同名 patched jar」（看
 * `allDependencies` 的构件名，不触发解析），与「谁把它带进来的」无关 ——
 * 逐个 exclude 堵来路这条路已经试过：带上游 jar 进来的路径不止一个，排掉一条，
 * 换条路径又漏回来。
 *
 * 为什么不是「解析完再把 artifact 从 `configuration.artifacts` 里删掉」：那样要
 * 在 `incoming.afterResolve` 里读 `resolvedArtifacts`，而这个惰性属性在 Gradle 9 的
 * configuration cache 序列化阶段会被重新求值一次 —— 那时解析早已结束，于是整次
 * 构建死在缓存写入上（`cnb-d7c-1k623dl4d` 的 Android Lint）：
 *
 *   Configuration cache state could not be cached: field `importDirs` of
 *   task `:app:compileDebugAidl` ...: error writing value of type
 *   'ResolutionBackedFileCollection'
 *   > Could not get unknown property 'resolvedArtifacts' for dependencies
 *     ':app:debugCompileClasspath'
 *
 * 同一条坑对任何「解析后再读惰性属性」的写法都成立：见到
 * `Could not get unknown property` 先怀疑这里，别急着怀疑依赖坐标。
 *
 * 三条不变量，改之前先读：
 *   1. **只对 unidbg-api / unidbg-android 生效**。unicorn / capstone / keystone 的
 *      上游 jar 不是重复品而是替代品（见 app/build.gradle.kts 里 unicorn:1.0.15
 *      那段注释：它是 unicorn.* 唯一的来源），剔了会在 session_open 时
 *      ClassNotFoundException。
 *   2. **同一配置里必须同时看到 patched jar 才动**，否则说明该配置压根不需要它
 *      （比如 buildSrc 自己的编译配置）。
 *   3. 副作用会打一行 lifecycle 日志（[patched-jars] ...）：依赖图被动过，日志里
 *      得看得见，否则下次查重复类会先怀疑仓库。
 */

import org.gradle.api.artifacts.component.ModuleComponentSelector

def somcpPatchedGroups = [
    'com.github.zhkl0228',
] as Set

// 上游要摘掉的 module（group 见上）。只有这条白名单生效 —— 见不变量 1。
def somcpPatchedModules = [
    'unidbg-api',
    'unidbg-android',
] as Set

configurations.configureEach { configuration ->
    configuration.incoming.artifactView { view ->
        view.beforeResolve { resolvableDependencies ->
            // 先判「这个配置里有没有 patched jar」（不变量 2）：只看构件名，
            // 不触发解析。files() 依赖在配置期就已经在 allDependencies 里了。
            Set<String> patchedNames = configuration.allDependencies
                .collect { it.name }
                .findAll { it != null && it.contains('-patched') }

            if (patchedNames.isEmpty()) {
                return
            }

            Set<String> shadowed = somcpPatchedModules
                .findAll { module -> patchedNames.any { it.startsWith("${module}-") } } as Set
            if (shadowed.isEmpty()) {
                return
            }

            def dropped = resolvableDependencies.dependencies.findAll { dependency ->
                def selector = dependency as ModuleComponentSelector
                selector.group in somcpPatchedGroups && shadowed.contains(selector.module)
            }*.toString()

            if (dropped.isEmpty()) {
                return
            }

            // 不变量 3：依赖图被动过，日志里看得见。
            logger.lifecycle("[patched-jars] ${configuration.name}: drop upstream ${dropped.join(', ')}")
            resolvableDependencies.dependencies.removeAll { dependency ->
                def selector = dependency as ModuleComponentSelector
                selector.group in somcpPatchedGroups && shadowed.contains(selector.module)
            }
        }
    }
}

// 「只看缓存」模式：把插件仓库与依赖仓库**原位**换成本地空目录，顺序与数量保持不变。
//
// 为什么需要：`--offline` 只是「不许联网」，Gradle 仍然会拿仓库列表里的每个仓库
// 去 $GRADLE_USER_HOME/caches/modules-2 里查缓存索引，而「缓存里有」并不等于
// 「离线也能用」（缓存条目的失效时间、元数据过期都会让它重新联网），于是
// 「缓存里的 google 索引在、但 dl.google.com 此刻连不上」会被报成
//   Plugin [id: ...] was not found in any of the following sources: Google, cnb-plugin-mirror-0(...)
// 和「镜像预热根本没做完」一模一样 —— 判据被网络状况污染。
//
// 换成空文件仓库之后，能不能解析到构件**只取决于用户目录里有什么**：
//   * 命中 = 预热确实下过这份构件（空目录里什么也没有，走不到网络）；
//   * 未命中 = 确实没有，这时报「warmup cache is incomplete」才是真话。
//
// **仓库列表必须和镜像预热时逐个对上**，否则判据从「有没有」变成「名字对不对」：
// Gradle 的模块缓存是按仓库 url 算 hash 之后分索引的
// （`caches/modules-2/metadata-<n>/descriptors/<group>/<module>/<version>/<hash>/…`），
// 换一个 url 就等于换一份缓存。早先这里把列表清空、塞进唯一一个叫
// cnb-cache-only 的空仓库，于是镜像里预热在 Google / MavenRepo / JitPack /
// 两个 cnb-mirror-* 名下，运行时却拿着一个谁都没预热过的空仓库去查 —— 必然全灭，
// 报出来却是「预热不完整」，指向错了地方。
//
// 做法是**原位替换**：顺序、数量都跟预热时一致，把每个 url 换成本地空目录，
// 再用 Gradle 的仓库信息文件把「缓存 hash 用的 url」指回原来那个。
// 于是命中与否只取决于「预热有没有下过这份构件」，与网络、与名字都无关。
//
// 由 scripts/cnb/setup-build-env.sh 传 -PcnbCacheOnlyCheck 触发，
// scripts/cnb/gradle-proxy.init.gradle.kts 负责 apply 本文件。
// 只在 CNB 里生效（init script 那侧的 CNB_BUILD_ID 判断），本地构建不受影响。

// 原位替换：不增不减、不打乱顺序，逐个把 url 换成本地空目录。
// 空目录保证「未命中就是真的没有」，--offline 保证不会真的出网。
// 本地空目录必须跟 GRADLE_USER_HOME 走，不能写死 ~/.gradle：镜像里那个变量是
// /root/.gradle、user.home 也是 /root，看起来一样；但预热复核用的 GRADLE_USER_HOME
// 是 /tmp/cnb-warmup-home，CNB 的 task 容器也不保证 HOME 等于它。写死只会把目录
// 生成在别处（判据本身不受影响，但位置对不上，排查时容易往错的方向找）。
def gradleUserHome = new File(System.getenv('GRADLE_USER_HOME') ?: System.getProperty('user.home') + '/.gradle')

def mirrorLayers = []
def restrict = { repositories, layer ->
    def originals = repositories.collect { repo -> [repo.name, repo.url.toString()] }
    repositories.clear()
    originals.eachWithIndex { original, i ->
        def name = original[0]
        def url = original[1]
        def repoDir = new File(gradleUserHome, "cnb-cache-only/${layer}/${i}")
        repoDir.mkdirs()
        repositories.maven { repo ->
            repo.name = "${name}-cache-only"
            repo.url = repoDir.toURI()
        }
        // 仓库信息文件：Gradle 用它算缓存的 hash 与「名字↔url 绑定」，覆盖后相当于
        // 「这个空仓库的缓存索引就是原来那个 url 的索引」。
        // 写法照 Gradle 自己生成的 ${repoDir}/.gradle/repo-info.json。
        //
        // 兼容性说明：这个文件不是公开 API。万一将来的 Gradle 不再读它，
        // 复核会退化成「每条依赖都未命中」—— 也就是**偏严**的失败，不会误放行，
        // 届时按日志里 `Searched in` 的清单更新这里即可。
        //
        // 只写 url 与 type，不写 name：url 就是算 hash 的输入，名字留给 Gradle 自己填，
        // 少一个可能过期的字段。url 用 JsonOutput 转义，省得手拼引号。
        //
        // 索引对不上时的报错长这样（这一条专门为了别让人白找）：
        //   Plugin [id: ...] was not found / Could not resolve ...
        //     Searched in the following locations: .../cnb-cache-only/plugins/0/...
        // 出现它意味着「这份构件在别的仓库索引里」。最典型的是镜像（cnb-mirror-*）：
        // 联网预热时它排在前面，Google 上没有的坐标（jetbrains / slack 之类）会被
        // 它接走，于是缓存是按镜像的 url 建索引的，而复核用的空仓库按**仓库顺序**
        // 跟原列表逐位对齐 —— 顺序里 mirror 排在 google 后面，对不上。判据「偏严」
        // 那一侧，不会误放行，所以只在下面打一句解释，不去猜。
        def infoDir = new File(repoDir, '.gradle')
        infoDir.mkdirs()
        new File(infoDir, 'repo-info.json').text = "{\"url\": ${groovy.json.JsonOutput.toJson(url)}, \"type\": \"maven\"}\n"
        if (name.startsWith('cnb-') && name.contains('mirror')) {
            mirrorLayers << "${layer}[${i}] ${name}"
        }
        println "[cnb-cache-only] ${layer}[${i}] ${name} (${url}) -> local cache index"
    }
}

beforeSettings { settings ->
    restrict(settings.pluginManagement.repositories, 'plugins')
    restrict(settings.dependencyResolutionManagement.repositories, 'deps')
    println '[cnb-cache-only] repositories restricted to the local Gradle cache'
    if (!mirrorLayers.isEmpty()) {
        println "[cnb-cache-only] note: ${mirrorLayers.size()} mirror repositories are part of the list " +
            "(${mirrorLayers.join(', ')}). If a coordinate was downloaded through a mirror during the " +
            "online warmup, its cache index belongs to that mirror and this recheck still rejects it " +
            "(stricter by design, never a false pass)."
    }
}

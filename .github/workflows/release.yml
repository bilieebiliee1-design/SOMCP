name: Release

on:
  release:
    types:
      - published
  push:
    tags:
      - 'v*'
  # Manual entry point: lets you verify the workflow is enabled/valid from
  # the Actions tab without waiting for a release event. Note that a manual
  # run has no release tag, so RELEASE_TAG falls back to the branch name.
  workflow_dispatch:

# A tag push and a GitHub Release created on the same tag both fire this
# workflow; serialize by tag so we never build the same release twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build gcc g++ pkg-config
      - name: Clone Rizin source (v0.10.0)
        run: |
          if [ ! -d third_party/rizin-src/librz/include ]; then
            git clone https://github.com/rizinorg/rizin.git third_party/rizin-src
          fi
      - name: Cache native backends (Rizin + LIEF)
        uses: actions/cache@v4
        with:
          # Release jobs only read the cache; they never write it, so a
          # compromised cache entry cannot be produced from the release side.
          lookup-only: true
          path: |
            rizin-build
            third_party/lief-build
          # Key derived from the build script, cross templates and CMakeLists:
          # any change to how the archives are produced invalidates the cache.
          key: native-linux-${{ hashFiles('build-native-android.sh', 'rizin-cross-*.ini', 'rizin-native.ini', 'app/src/main/cpp/CMakeLists.txt') }}-ndk29
      - name: Build native backends (Rizin + LIEF)
        run: bash build-native-android.sh

      - name: Build Unidbg native libs (capstone/keystone/unicorn)
        run: |
          set -euo pipefail
          # Cross-compile the Android natives required by the Unidbg backend
          # (libcapstone.so / libkeystone.so / libunicorn.so). unidbg 0.9.9
          # Maven artifacts only ship linux_64/linux_aarch64 .so, so without
          # this step the release APK would be published WITHOUT the libs and
          # emulate_* would return EMULATOR_UNAVAILABLE (see issue #35).
          # This step is fatal on failure so a release can never be built
          # without the Unidbg natives again.
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            bash build-unidbg-native.sh --abi "$abi"
          done
          # Sanity-check that every ABI now has all three natives in jniLibs
          # before the APK is assembled; abort if any is missing.
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for lib in capstone keystone unicorn; do
              test -f "app/src/main/jniLibs/$abi/lib$lib.so" || {
                echo "::error::missing app/src/main/jniLibs/$abi/lib$lib.so after build-unidbg-native.sh"
                exit 1
              }
            done
          done
          echo "Unidbg native libs present for all four ABIs."

      - name: Restore release signing keystore
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.KEYSTORE }}" ] \
             || [ -z "${{ secrets.ALIAS }}" ] \
             || [ -z "${{ secrets.ALIAS_PASSWORD }}" ] \
             || [ -z "${{ secrets.PASSWORD }}" ]; then
            echo "::error::Release signing secrets (KEYSTORE/ALIAS/ALIAS_PASSWORD/PASSWORD) must all be configured."
            exit 1
          fi
          # Real release keystore from repository secrets (BASE64-encoded).
          mkdir -p release
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release/so-reverse-mcp-release.jks
          echo "Restored release signing keystore from secrets."

      - name: Build release APKs
        env:
          # Pass signing secrets via env vars (read by app/build.gradle.kts),
          # so no plaintext keystore.properties is ever written to disk.
          STORE_FILE: release/so-reverse-mcp-release.jks
          STORE_PASSWORD: ${{ secrets.PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace

      - name: Wipe signing artifacts
        run: |
          set -euo pipefail
          rm -f release/keystore.properties release/*.jks release/*.jks.asc
          # Whitelist: only APKs + SHA256SUMS may be uploaded. Anything else
          # (e.g. a stray keystore/config file) fails the job instead of leaking.
          if find release -type f ! -name '*.apk' ! -name 'SHA256SUMS' -print -quit | grep -q .; then
            echo "::error::Unexpected artifact found in release/; aborting upload."
            find release -type f ! -name '*.apk' ! -name 'SHA256SUMS' -print
            exit 1
          fi
          echo "release/ contents (safe to upload):"
          ls -la release/

      - name: Generate release notes with LLM
        env:
          USER_AGENT: ${{ secrets.USER_AGENT }}
          LLM_MODEL: ${{ secrets.LLM }}
          LLM_KEY: ${{ secrets.KEY }}
          LLM_API: ${{ secrets.API }}
          # Works for both triggers: on a tag push github.ref_name is the
          # tag (vX.Y.Z); on a published release it is also the tag name.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Collect commits between the previous tag and the current release tag.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-decorate "$PREV_TAG"..HEAD)
          else
            COMMITS=$(git log --oneline --no-decorate -50 HEAD)
          fi
          # Build the OpenAI-compatible chat payload with jq so commit messages
          # are passed as data, never evaluated by the shell. Tag name and
          # secrets arrive via env vars, never interpolated into the script.
          payload=$(jq -n \
            --arg model "$LLM_MODEL" \
            --arg commits "$COMMITS" \
            --arg tag "$RELEASE_TAG" \
            --arg prev "$PREV_TAG" \
            '{model: $model, messages: [
               {role: "system", content: "你是一个专业的开源项目发布助手。根据提供的 commit 列表为 Android 应用生成 Release Notes，必须严格遵循仓库现有发布说明的模板格式（简体中文 Markdown），模板示例如下：\n\n# SOMCP 1.0.17\n\n本发布说明仅包含 `v1.0.16..v1.0.17` 的增量变化。\n\n## 更新内容\n\n- 条目1\n- 条目2\n\n## 验证\n\n- JVM 单元测试。\n- Debug Kotlin、Java 与四 ABI 原生编译。\n- Release 原生与 Android 构建。\n- Release APK 签名与 SHA-256 校验。\n\n## 发布资产\n\n- `SOMCP-1.0.17-arm64-v8a.apk`\n- `SOMCP-1.0.17-armeabi-v7a.apk`\n- `SOMCP-1.0.17-x86.apk`\n- `SOMCP-1.0.17-x86_64.apk`\n- `SOMCP-1.0.17-universal.apk`\n- `SHA256SUMS`\n\n硬性要求（务必遵守）：\n1. 全文必须且只使用简体中文（标题、章节名、每条内容均为中文），禁止出现任何英文正文（专有名词如 APK、JSON、Argon2 等可保留英文）。\n2. 一级标题为 `# SOMCP <版本号>`，版本号取自本次 tag；`本发布说明仅包含` 那行填 `上一版本..当前版本`（无上一版本时写 `初始发布`）。\n3. 「更新内容」每条使用短横线 `-` 列表（不要用星号），基于 commit 归纳、简洁准确、不编造。\n4. 「验证」「发布资产」按模板原样输出，发布资产文件名中的版本号替换为本次版本号。\n5. 不要包含任何 GitHub Actions 表达式（如双花括号表达式）。"},
               {role: "user", content: ("当前版本：" + $tag + "；上一版本：" + (if $prev == "" then "无" else $prev end) + "\n\nCommit 列表：\n" + $commits)}
             ], temperature: 0.7}')
          # Determine the chat completions endpoint. Tencent Copilot
          # (https://copilot.tencent.com) serves /v2/chat/completions and
          # requires a User-Agent header from the $USER_AGENT env var.
          # DeepSeek's base URL (https://api.deepseek.com) serves
          # /chat/completions directly; other OpenAI-compatible platforms
          # use <base>/v1/chat/completions, e.g.
          # https://token.sensenova.cn/v1/chat/completions.
          CURL_EXTRA_ARGS=()
          if [[ "$LLM_API" == "https://copilot.tencent.com" ]]; then
            ENDPOINT="$LLM_API/v2/chat/completions"
            CURL_EXTRA_ARGS+=(-H "User-Agent: ${USER_AGENT:-}")
          elif [[ "$LLM_API" == *"api.deepseek.com"* ]]; then
            ENDPOINT="$LLM_API/chat/completions"
          else
            ENDPOINT="$LLM_API/v1/chat/completions"
          fi
          if response=$(curl -sS -f -m 120 -X POST \
              -H "Authorization: Bearer $LLM_KEY" \
              -H "Content-Type: application/json" \
              "${CURL_EXTRA_ARGS[@]}" \
              -d "$payload" \
              "$ENDPOINT"); then
            content=$(printf '%s' "$response" | jq -r '.choices[0].message.content // empty')
            if [ -n "$content" ]; then
              printf '%s\n' "$content" > release_notes.md
              echo "Generated release notes with model $LLM_MODEL."
            else
              echo "::warning::LLM returned empty content; falling back to a plain commit list."
            fi
          else
            echo "::warning::LLM API request failed; falling back to a plain commit list."
          fi
          # Fallback: a plain commit-list notes file in the repository's
          # Chinese template, so the release always has content and the
          # upload step's body_path never points at a missing or empty file.
          # This stays in 简体中文 to match the project's release notes
          # convention even when the LLM call fails.
          if [ ! -s release_notes.md ]; then
            {
              echo "# SOMCP ${RELEASE_TAG#v}"
              echo ""
              if [ -n "$PREV_TAG" ]; then
                echo "本发布说明仅包含 \`$PREV_TAG..$RELEASE_TAG\` 的增量变化。"
              else
                echo "本发布说明为初始发布。"
              fi
              echo ""
              echo "## 更新内容"
              echo ""
              if [ -n "$PREV_TAG" ]; then
                git log --oneline --no-decorate "$PREV_TAG"..HEAD | sed 's/^/- /'
              else
                git log --oneline --no-decorate -50 HEAD | sed 's/^/- /'
              fi
              echo ""
              echo "## 验证"
              echo ""
              echo "- JVM 单元测试。"
              echo "- Debug Kotlin、Java 与四 ABI 原生编译。"
              echo "- Release 原生与 Android 构建。"
              echo "- Release APK 签名与 SHA-256 校验。"
              echo ""
              echo "## 发布资产"
              echo ""
              echo "- \`SOMCP-${RELEASE_TAG#v}-arm64-v8a.apk\`"
              echo "- \`SOMCP-${RELEASE_TAG#v}-armeabi-v7a.apk\`"
              echo "- \`SOMCP-${RELEASE_TAG#v}-x86.apk\`"
              echo "- \`SOMCP-${RELEASE_TAG#v}-x86_64.apk\`"
              echo "- \`SOMCP-${RELEASE_TAG#v}-universal.apk\`"
              echo "- \`SHA256SUMS\`"
            } > release_notes.md
          fi
          echo "Release notes written to release_notes.md"

      - name: Append build time to release notes
        run: |
          set -euo pipefail
          # 构建时间固定使用北京时间（UTC+8），精确到秒
          printf '\n---\n\n**构建时间：%s（北京时间）**\n' "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" >> release_notes.md
          echo "Appended build time to release notes."

      - name: Rename APKs and generate SHA256SUMS
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p release
          shopt -s nullglob
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f")
            if [[ "$b" == *"-arm64-v8a-release.apk" ]]; then
              name="arm64-v8a"
            elif [[ "$b" == *"-armeabi-v7a-release.apk" ]]; then
              name="armeabi-v7a"
            elif [[ "$b" == *"-x86_64-release.apk" ]]; then
              name="x86_64"
            elif [[ "$b" == *"-x86-release.apk" ]]; then
              name="x86"
            elif [[ "$b" == *"-universal-release.apk" ]]; then
              name="universal"
            else
              echo "::error::Unknown APK name: $b"
              exit 1
            fi
            cp "$f" "release/SOMCP-${VERSION}-${name}.apk"
          done
          (
            cd release
            sha256sum SOMCP-*.apk > SHA256SUMS
          )
          echo "Prepared release APKs and SHA256SUMS in release/:"
          ls -la release/

      - name: Upload APKs and release notes to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          body_path: release_notes.md

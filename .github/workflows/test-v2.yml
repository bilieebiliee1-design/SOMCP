name: Test v2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - uses: android-actions/setup-android@v3
        with:
          # The action's default packages are "tools platform-tools". Google has
          # removed the legacy `tools` package from the SDK repository, so keep
          # platform-tools only.
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Lint check
        run: gradle :app:lintDebug --stacktrace
      - name: Debug build
        run: gradle :app:assembleDebug --stacktrace
      - name: Unit tests (strict)
        run: gradle :app:testDebugUnitTest --stacktrace -Pkotlin.compiler.allWarningsAsErrors=true
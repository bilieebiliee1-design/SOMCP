name: Test v5

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Determine base revision
        id: base-rev
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for empty PR
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          changed_files=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || echo "")
          if [ -z "$changed_files" ]; then
            echo "::error::This PR contains no meaningful changes compared to the base branch."
            exit 1
          fi
          echo "Changed files:"
          echo "$changed_files"

      - name: Profanity check
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          # Pattern list: common profanity (case-insensitive)
          PATTERNS="\bfuck\b|\bshit\b|\bbitch\b|\bass\b|\bdamn\b|\bcrap\b|\bdick\b|\bbastard\b|\bslut\b|\bwhore\b|\bpiss\b|\bcock\b|\bcunt\b|\basshole\b|\bmotherfucker\b|\bfucker\b|\bfucking\b|\bsonofabitch\b|\b混蛋\b|\b傻逼\b|\b操你妈\b|\b草泥马\b|\b他妈\b|\b尼玛\b|\b艹\b|\bfuckyou\b|\bfk\b"
          violations=$(git diff "$BASE"...HEAD --diff-filter=AM \
            | grep -n -i -E "$PATTERNS" \
            | sed 's/^/  /' || true)
          if [ -n "$violations" ]; then
            echo "::error::Profanity detected in the following diff lines:"
            echo "$violations"
            exit 1
          fi
          echo "Profanity check passed."

      - name: AGPL-3.0-only license compliance check
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          exit_code=0

          # 1. Ensure the LICENSE file is not removed
          if git diff "$BASE"...HEAD --name-only --diff-filter=D | grep -q "^LICENSE$"; then
            echo "::error::The LICENSE file must not be deleted. This project is AGPL-3.0-only."
            exit_code=1
          fi

          # 2. Ensure the LICENSE file, if modified, still carries the AGPL-3.0 notice
          if git diff "$BASE"...HEAD --name-only --diff-filter=M | grep -q "^LICENSE$"; then
            if ! head -n 1 LICENSE | grep -qi "GNU AFFERO GENERAL PUBLIC LICENSE"; then
              echo "::error::The LICENSE file must remain licensed under AGPL-3.0-only."
              exit_code=1
            fi
          fi

          # 3. Check newly added source files for a AGPL-3.0 license header
          NEW_SOURCE_FILES=$(git diff "$BASE"...HEAD --name-only --diff-filter=A \
            | grep -E '\.(kt|java|cpp|c|h|hpp|py|rs|go|sh|gradle|groovy)$' || true)
          if [ -n "$NEW_SOURCE_FILES" ]; then
            while IFS= read -r file; do
              # Check for AGPL-3.0 reference in the first 30 lines
              if ! head -n 30 "$file" | grep -qi "GNU.*Affero.*General.*Public.*License\|AGPL[- ]3\.0\|AGPL-3\.0-only"; then
                echo "::error::New source file '$file' is missing a AGPL-3.0 license header. All new files must be licensed under AGPL-3.0-only."
                exit_code=1
              fi
            done <<< "$NEW_SOURCE_FILES"
          fi

          if [ $exit_code -eq 0 ]; then
            echo "AGPL-3.0-only compliance check passed."
          fi
          exit $exit_code

      - name: Lint check
        run: gradle :app:lintDebug --stacktrace
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build gcc g++ pkg-config
      - name: Clone Rizin source (v0.10.0)
        run: |
          if [ ! -d third_party/rizin-src/librz/include ]; then
            git clone https://github.com/rizinorg/rizin.git third_party/rizin-src
          fi
      - name: Cache native backends (Rizin + LIEF)
        uses: actions/cache@v4
        with:
          path: |
            rizin-build
            third_party/lief-build
          # Key derived from the build script, cross templates and CMakeLists:
          # any change to how the archives are produced invalidates the cache.
          key: native-linux-${{ hashFiles('build-native-android.sh', 'rizin-cross-*.ini', 'rizin-native.ini', 'app/src/main/cpp/CMakeLists.txt') }}-ndk29
      - name: Build native backends (Rizin + LIEF)
        run: bash build-native-android.sh
      - name: Debug build
        run: gradle :app:assembleDebug --stacktrace
      - name: Restore release signing keystore (or CI fallback)
        run: |
          set -euo pipefail
          mkdir -p release
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            # Real release keystore from repository secrets (BASE64-encoded).
            echo "${{ secrets.KEYSTORE }}" | base64 -d > release/so-reverse-mcp-release.jks
            {
              echo "storeFile=release/so-reverse-mcp-release.jks"
              echo "storePassword=${{ secrets.PASSWORD }}"
              echo "keyAlias=${{ secrets.ALIAS }}"
              echo "keyPassword=${{ secrets.ALIAS_PASSWORD }}"
            } > release/keystore.properties
            echo "Restored release signing keystore from secrets."
          else
            # Fallback (e.g. fork PRs cannot access repository secrets):
            # CI-only throwaway keystore, fresh key each run, NOT for
            # distribution. APKs signed with it cannot be installed over the
            # real release (docs/forum-post.md); build verification only.
            STORE_PASS="ci-$(openssl rand -hex 16)"
            keytool -genkeypair -v \
              -storetype JKS \
              -keystore release/so-reverse-mcp-release.jks \
              -alias so-reverse-mcp \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -dname "CN=SOMCP CI, O=SoReverse MCP, C=CN"
            {
              echo "storeFile=release/so-reverse-mcp-release.jks"
              echo "storePassword=$STORE_PASS"
              echo "keyAlias=so-reverse-mcp"
              echo "keyPassword=$STORE_PASS"
            } > release/keystore.properties
            echo "Secrets unavailable; generated CI-only signing keystore (not for distribution)."
          fi
      - name: Release build
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify and ensure v2/v3 APK signing
        run: |
          set -euo pipefail
          storeFile=$(grep '^storeFile=' release/keystore.properties | head -1 | cut -d= -f2-)
          storePassword=$(grep '^storePassword=' release/keystore.properties | head -1 | cut -d= -f2-)
          keyAlias=$(grep '^keyAlias=' release/keystore.properties | head -1 | cut -d= -f2-)
          keyPassword=$(grep '^keyPassword=' release/keystore.properties | head -1 | cut -d= -f2-)
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== Checking signing schemes: $(basename "$apk") ==="
            if "$APKSIGNER" verify --verbose "$apk" 2>&1 | grep -qi "NOT PRESENT"; then
              echo "::warning::v2/v3 signing NOT verified in $(basename "$apk"); re-signing with apksigner"
              "$APKSIGNER" sign \
                --ks "$storeFile" \
                --ks-pass "pass:$storePassword" \
                --ks-key-alias "$keyAlias" \
                --key-pass "pass:$keyPassword" \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                --v4-signing-enabled true \
                "$apk"
            fi
            "$APKSIGNER" verify --print-certs "$apk"
            echo "✓ $(basename "$apk") has valid v2/v3 signing"
          done
      - name: Unit tests (strict)
        run: gradle :app:testDebugUnitTest --stacktrace -Pkotlin.compiler.allWarningsAsErrors=true
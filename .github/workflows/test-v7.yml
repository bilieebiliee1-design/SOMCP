name: Test v7

on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
          cache-disabled: true
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Determine base revision
        id: base-rev
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for empty PR
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          changed_files=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || echo "")
          if [ -z "$changed_files" ]; then
            echo "::error::This PR contains no meaningful changes compared to the base branch."
            exit 1
          fi
          echo "Changed files:"
          echo "$changed_files"
      - name: Profanity check
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          PATTERNS="\bfuck\b|\bshit\b|\bbitch\b|\bass\b|\bdamn\b|\bcrap\b|\bdick\b|\bbastard\b|\bslut\b|\bwhore\b|\bpiss\b|\bcock\b|\bcunt\b|\basshole\b|\bmotherfucker\b|\bfucker\b|\bfucking\b|\bsonofabitch\b|\b混蛋\b|\b傻逼\b|\b操你妈\b|\b草泥马\b|\b他妈\b|\b尼玛\b|\b艹\b|\bfuckyou\b|\bfk\b"
          violations=$(git diff "$BASE"...HEAD --diff-filter=AM \
            | grep -n -i -E "$PATTERNS" \
            | sed 's/^/  /' || true)
          if [ -n "$violations" ]; then
            echo "::error::Profanity detected in the following diff lines:"
            echo "$violations"
            exit 1
          fi
          echo "Profanity check passed."
      - name: GPL-3.0-only license compliance check
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          exit_code=0
          if git diff "$BASE"...HEAD --name-only --diff-filter=D | grep -q "^LICENSE$"; then
            echo "::error::The LICENSE file must not be deleted. This project is GPL-3.0-only."
            exit_code=1
          fi
          if git diff "$BASE"...HEAD --name-only --diff-filter=M | grep -q "^LICENSE$"; then
            echo "::error::The LICENSE file must not be modified. GPL-3.0-only is the governing license."
            exit_code=1
          fi
          NEW_SOURCE_FILES=$(git diff "$BASE"...HEAD --name-only --diff-filter=A \
            | grep -E '\.(kt|java|cpp|c|h|hpp|py|rs|go|sh|gradle|groovy)$' || true)
          if [ -n "$NEW_SOURCE_FILES" ]; then
            while IFS= read -r file; do
              if ! head -n 30 "$file" | grep -qi "GNU.*General.*Public.*License\|GPL[- ]3\.0\|GPL-3\.0-only"; then
                echo "::error::New source file '$file' is missing a GPL-3.0 license header. All new files must be licensed under GPL-3.0-only."
                exit_code=1
              fi
            done <<< "$NEW_SOURCE_FILES"
          fi
          if [ $exit_code -eq 0 ]; then
            echo "GPL-3.0-only compliance check passed."
          fi
          exit $exit_code
      - name: PR size check
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          total_files=$(git diff --name-only "$BASE"...HEAD | wc -l)
          total_additions=$(git diff "$BASE"...HEAD --diff-filter=AM --numstat | awk '{s+=$1} END {print s}')
          echo "PR stats: $total_files files changed, ~${total_additions:-0} additions"
          if [ "$total_files" -gt 50 ]; then
            echo "::warning::Large PR: $total_files files changed. Consider splitting into smaller, focused PRs."
          fi
          if [ "${total_additions:-0}" -gt 2000 ]; then
            echo "::warning::Large PR: ~$total_additions lines added. Consider splitting into smaller, focused PRs."
          fi
      - name: ktlint — Kotlin code style check
        run: |
          cd /tmp
          curl -sSLO -L "https://github.com/ktlint/ktlint/releases/download/1.5.0/ktlint"
          chmod +x ktlint
          cd -
          violations=$(/tmp/ktlint --relative "app/src/**/*.kt" 2>&1) || true
          if [ -n "$violations" ]; then
            echo "::error::Kotlin code style violations found:"
            echo "$violations"
            exit 1
          fi
          echo "ktlint check passed."
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Lint check
        run: gradle :app:lintDebug --stacktrace
      - name: Debug build
        run: gradle :app:assembleDebug --stacktrace
      - name: Release build
        run: gradle :app:assembleRelease --stacktrace
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

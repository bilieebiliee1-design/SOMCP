name: Test v3

# 见 test.yml：自动合并（GITHUB_TOKEN）不会触发 push 事件，由
# pr-auto-review.yml 在合并后 dispatch 补触发。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # No submodules here on purpose. These Gradle-only jobs do reach
          # third_party/: preBuild dependsOn buildUnidbgNative (app/build.gradle.kts:320),
          # app/src/main/jniLibs ships no libcapstone/keystone/unicorn, so that task
          # really invokes build-unidbg-native.sh, which needs third_party/* and fails
          # on the first ABI when they are absent (capstone is built first;
          # build-unidbg-native.sh:237-247 -> :194-196). The Gradle task's
          # catch (e: Exception) at app/build.gradle.kts:290 downgrades that to the
          # logger.warn at :291-296, so the job still turns green -- which is exactly
          # why initializing the native tree here would buy nothing: it would add
          # minutes of cloning and put these jobs at the mercy of pins whose absence is
          # not fatal. Accepted side effect, pre-existing and not introduced by this
          # change: the artifacts from this job carry no Unidbg native libs.
          # The native jobs (build.yml, release.yml, test-v5..v11) init submodules via
          # tools/init-submodules.sh and are the ones that gate on those libs.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - uses: android-actions/setup-android@v3
        with:
          # The action's default packages are "tools platform-tools". Google has
          # removed the legacy `tools` package from the SDK repository, so keep
          # platform-tools only.
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Determine base revision
        id: base-rev
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for empty PR
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          changed_files=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || echo "")
          if [ -z "$changed_files" ]; then
            echo "::error::This PR contains no meaningful changes compared to the base branch."
            exit 1
          fi
          echo "Changed files:"
          echo "$changed_files"

      - name: Profanity check
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          # Pattern list: common profanity (case-insensitive)
          PATTERNS="\bfuck\b|\bshit\b|\bbitch\b|\bass\b|\bdamn\b|\bcrap\b|\bdick\b|\bbastard\b|\bslut\b|\bwhore\b|\bpiss\b|\bcock\b|\bcunt\b|\basshole\b|\bmotherfucker\b|\bfucker\b|\bfucking\b|\bsonofabitch\b|\b混蛋\b|\b傻逼\b|\b操你妈\b|\b草泥马\b|\b他妈\b|\b尼玛\b|\b艹\b|\bfuckyou\b|\bfk\b"
          violations=$(git diff "$BASE"...HEAD --diff-filter=AM \
            | grep -n -i -E "$PATTERNS" \
            | sed 's/^/  /' || true)
          if [ -n "$violations" ]; then
            echo "::error::Profanity detected in the following diff lines:"
            echo "$violations"
            exit 1
          fi
          echo "Profanity check passed."

      - name: Lint check
        run: gradle :app:lintDebug --stacktrace
      - name: Debug build
        run: gradle :app:assembleDebug --stacktrace
      - name: Unit tests (strict)
        run: gradle :app:testDebugUnitTest --stacktrace -Pkotlin.compiler.allWarningsAsErrors=true